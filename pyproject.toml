[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shardreaper"
version = "1.2.0"
description = "ShardReaper — a complete, aggressive autonomous red team agent. Engages targets, routes the local offensive corpus (Atomic Red Team, HackTricks, ired.team, BugHunter, tool catalogs), runs recon, executes techniques, and produces operator-ready reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ShardReaper" }]
keywords = ["red-team", "offensive-security", "pentest", "att&ck", "agent", "adversary-simulation"]
dependencies = []

[project.optional-dependencies]
# everything is stdlib-first; these are optional accelerators
http = ["requests"]
yaml = ["PyYAML"]

[project.scripts]
shardreaper = "shardreaper.cli:main"

[tool.setuptools]
packages = ["shardreaper"]

[tool.setuptools.package-data]
shardreaper = ["data/*.json", "data/wordlists/*.txt"]
